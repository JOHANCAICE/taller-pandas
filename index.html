# Variable: un nombre que guarda un valor

.pull-left[
```python
cantidad = 6
precio = 3.39
total = cantidad * precio
print(total)
```

El signo `=` **no es una igualdad matemática**: es una .key[asignación]. 

Primero se evalúa la derecha y el resultado se guarda con el nombre de la izquierda.
]

.pull-right[
### Reglas de nombre:
- Sin espacios (`precio_unitario`).
- No inicia con números (`factura1`).
- Distingue mayúsculas (`total` ≠ `Total`).

.callout[Un buen nombre **explica lo que contiene**: prefiere `precio_unitario` sobre `x`.]
]

# Tipos de datos básicos y su comportamiento

| Tipo | Qué guarda | Ejemplo | Comportamiento con `+` |
|---|---|---|---|
| `int` | Números enteros | `6` | Suma aritmética |
| `float` | Números decimales | `3.39` | Suma aritmética |
| `str` | Texto | `"WHITE METAL LANTERN"` | **Concatena (pega)** |
| `bool` | Lógico | `True` / `False` | Operaciones lógicas |

--

```python
# El tipo cambia el resultado de la operación:
5 + 3        # Da 8  (Suma aritmética)
"5" + "3"    # Da "53" (Concatenación de texto)
```

.callout[Un número entre comillas **ya no es un número: es texto**. Usamos `type()` para diagnosticar.]

# Hallazgos del diagnóstico en `Online Retail`

Al inspeccionar los datos descubrimos **4 problemas críticos**:

| Columna | Problema detectado | Tipo actual | Tipo correcto requerido |
|---|---|---|---|
| `InvoiceDate` | Está guardada como texto puro | `object` | `datetime64` |
| `CustomerID` | Tiene decimales (`17850.0`) por culpa de los `NaN` | `float64` | `Int64` (entero con nulos) |
| `Description` | Contiene espacios extras y desorden de mayúsculas | `object` | `string` limpio |
| `Quantity` / `UnitPrice` | Existen valores negativos y precios iguales a cero | Numérico | Filtro de registros válidos |

.callout[El tipo de dato `object` indica texto o mezcla de datos. Debe convertirse para poder operar.]

---
# 1. Tratamiento de textos en columnas `str`

.pull-left[
```python
# Normalización de textos
df["Description"] = (
    df["Description"]
    .astype("string")
    .str.strip()
    .str.title()
)
```
]

.pull-right[
### Métodos `.str`:
- `.str.strip()`: Elimina espacios al inicio y al final.
- `.str.title()`: Convierte a formato Título (`"White Metal Lantern"`).

.callout[Sin esta limpieza, `"WHITE METAL"` y `"WHITE METAL "` se procesan como productos distintos.]
]

---
# 2. Conversión formal de tipos de datos (`dtypes`)

.pull-left[
```python
# Convertir texto a fecha real
df["InvoiceDate"] = pd.to_datetime(
    df["InvoiceDate"], 
    errors="coerce"
)

# Convertir ID a entero con nulos
df["CustomerID"] = df["CustomerID"].astype("Int64")
```
]

.pull-right[
### ¿Por qué `Int64` con mayúscula?

El tipo estándar `int64` de Python no tolera nulos (`NaN`). 

Usamos `Int64` (de pandas) para conservar enteros manteniendo los nulos sin decimales.

.callout[Con `datetime64`, habilitamos el accesor `.dt` (mes, año, hora). Ojo: `errors="coerce"` convierte en `NaT` lo que no puede leer, sin avisar. Verifica con `df["InvoiceDate"].isna().sum()`.]
]

---
# 3. Manejo estratégico de faltantes (`NaN`)

.pull-left[
```python
# Opción 1: Eliminar nulos marginales
df = df.dropna(subset=["Description"])

# Opción 2: Marcar los nulos sin borrar
df["sin_cliente"] = df["CustomerID"].isna()
```
]

.pull-right[
### NaN no es cero

| Estrategia | Cuándo aplicarla |
|---|---|
| `dropna()` | Registros irrecuperables |
| Marcar (`isna()`) | Preservar datos anónimos |

.callout[Borrar filas elimina información; imputar inventa datos. Elige según el negocio.]
]

# 4. Seleccionar datos: `.loc` vs `.iloc`

Para acceder a celdas, filas y columnas específicas usamos `.loc` o `.iloc`:

.pull-left[
### `.loc` (Basado en ETIQUETAS)
Usa nombres de columnas y reglas lógicas (`True/False`):

```python
# Filas con condición, columnas por nombre
df.loc[
    df["Quantity"] &gt; 50, 
    ["Description", "UnitPrice"]
]
```
]

.pull-right[
### `.iloc` (Basado en POSICIÓN)
Usa índices numéricos enteros (0-indexed):

```python
# Primeras 5 filas, primeras 3 columnas
df.iloc[0:5, 0:3]
```
]

--

| Selector | ¿Cómo busca las filas? | ¿Cómo busca las columnas? | Ejemplo típico |
|---|---|---|---|
| **`.loc`** | Nombre del índice o condición booleana | Nombre exacto (`"UnitPrice"`) | `df.loc[df["Country"]=="France", :]` |
| **`.iloc`** | Número entero de fila (`0:10`) | Número entero de columna (`0:4`) | `df.iloc[0:10, [0, 2, 5]]` |

.callout[Regla práctica: **Usa `.loc` para reglas de negocio** (filtros) y **`.iloc` para recortes por posición**. En el siguiente paso usaremos `.loc` para crear `ventas`.]

---
# 5. Eliminación de duplicados y filtrado final

.pull-left-55[
```python
# Eliminar filas idénticas
df = df.drop_duplicates()

# Filtrar ventas efectivas con .loc
ventas = df.loc[
    (df["Quantity"] &gt; 0) &amp; 
    (df["UnitPrice"] &gt; 0)
].copy()

# Separar cancelaciones
canceladas = df.loc[
    df["InvoiceNo"]
    .astype("string")
    .str.startswith("C")
].copy()
```
]

.pull-right-40[
### Operadores Lógicos:

.regla[En pandas usamos:
- `&amp;` para **AND**
- `|` para **OR**
- `~` para **NOT**

Cada condición **debe ir entre paréntesis**.]
